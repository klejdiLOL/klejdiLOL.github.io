<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fjalor Shqip</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="top-left stacked-left">
      <a class="site-title" href="index.html">📘 Fjalor Shqip</a>
      <a class="manual-link manual-sub" href="manual.html">Manual</a>
    </div>

    <div class="top-center"></div>

    <div class="top-right">
      <div class="header-search">
        <button id="searchToggle" aria-label="Kërko">🔍</button>
        <input type="text" id="search" placeholder="Kërko fjalë..." aria-label="Kërko fjalë">
      </div>
      <button id="themeToggle" class="theme-toggle large-toggle">🌙</button>
      <button id="themeToggleMobile" class="theme-toggle theme-mobile large-toggle">🌙</button>
    </div>
  </header>

  <!-- Filter by morphological class -->
  <div class="filter-bar" id="classFilter" role="group" aria-label="Filtro sipas klasës morfologjike"></div>

  <!-- Screen-reader live region for result counts -->
  <div id="resultStatus" class="sr-only" role="status" aria-live="polite"></div>

  <!-- Main content -->
  <div id="container">
    <div class="alphabet-sidebar" id="alphabet"></div>
    <div id="dictionary"></div>
  </div>

  <!-- Breadcrumb / Back -->
  <div id="breadcrumb">
    <button id="backButton">⮐ Kthehu</button>
  </div>

  <!-- Back to Top -->
  <button id="backToTop" class="back-to-top" aria-label="Back to Top">⬆️</button>

  <script src="script.js"></script>
</body>
</html>
